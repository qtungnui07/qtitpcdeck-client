name: reusable-android-build.yml
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      base-build-artifact-name:
        required: true
        type: string
    outputs:
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.android-build.outputs.artifact_name }}

jobs:
  android-build:
    name: Build Android project
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download www base build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.base-build-artifact-name }}-www
          path: www/
      - name: Download node base build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.base-build-artifact-name }}-node
          path: node_modules/
      - name: Download android base build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.base-build-artifact-name }}-android
          path: android/
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Generate artifact name
        id: meta
        run: |
          ARTIFACT_NAME="android-debug-${{ inputs.version }}-${GITHUB_RUN_ID}"
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
